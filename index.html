<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>结果补语 · 把字句</title>

<style>
:root {
    font-family: system-ui, -apple-system, "Noto Sans SC", sans-serif;
    color: #222;
    background: #fafafa;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
}

main {
    max-width: 800px;
    margin: 48px auto;
    padding: 0 20px;
}

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid #ddd;
    padding-bottom: 20px;
}

h1 {
    font-size: 22px;
    font-weight: 550;
    margin: 0;
}

.subtitle {
    color: #888;
    font-size: 14px;
    margin-top: 4px;
}

.count {
    font-variant-numeric: tabular-nums;
    color: #777;
    font-size: 13px;
}

.progress {
    height: 3px;
    background: #eee;
    margin-top: 18px;
}

.bar {
    height: 100%;
    background: #222;
    width: 0;
    transition: width 0.2s;
}

.tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 25px 0;
}

button {
    font-family: inherit;
    background: white;
    border: 1px solid #ddd;
    border-radius: 5px;
    padding: 11px 15px;
    font-size: 16px;
    color: inherit;
    cursor: pointer;
}

button:hover {
    border-color: #777;
}

button:disabled {
    opacity: 0.45;
    cursor: default;
}

.tab {
    font-size: 14px;
}

.tab.active {
    background: #222;
    color: white;
    border-color: #222;
}

.panel {
    background: white;
    border: 1px solid #e5e5e5;
    border-radius: 8px;
    padding: 25px;
    min-height: 340px;
}

.top {
    display: flex;
    justify-content: space-between;
    color: #777;
    font-size: 13px;
    margin-bottom: 35px;
}

.prompt {
    font-size: 23px;
    line-height: 1.9;
    margin: 0 0 26px;
    white-space: pre-wrap;
}

.group {
    font-size: 15px;
    color: #888;
    margin-bottom: 14px;
}

.tiles,
.answer,
.choices {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    margin: 16px 0;
}

.answer {
    min-height: 60px;
    border: 1px dashed #ccc;
    border-radius: 5px;
    padding: 10px;
}

.tile {
    font-size: 20px;
    padding: 10px 14px;
}

.tile.selected {
    background: #f0f0f0;
    border-color: #222;
}

.choices {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
}

.choice {
    font-size: 22px;
    min-height: 58px;
}

.choice.active {
    border-color: #222;
    background: #eee;
}

.actions {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 30px;
    flex-wrap: wrap;
}

.primary {
    background: #222;
    color: white;
    border-color: #222;
}

.primary:hover {
    background: #444;
}

.status {
    font-size: 22px;
    margin-left: auto;
}

.good {
    color: #21834c;
}

.bad {
    color: #c34343;
}

.field {
    width: 100%;
    font-family: inherit;
    font-size: 21px;
    line-height: 1.6;
    border: 1px solid #ccc;
    border-radius: 5px;
    padding: 12px;
    outline: none;
}

.field:focus {
    border-color: #555;
}

.reference {
    font-size: 19px;
    line-height: 1.8;
    padding-top: 12px;
}

.hidden {
    display: none;
}

.match-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin: 12px 0;
}

.match-label {
    min-width: 145px;
    font-size: 18px;
}

.match-choice {
    font-size: 16px;
}

@media (max-width: 550px) {
    main {
        margin: 20px auto;
    }

    .panel {
        padding: 17px;
    }

    .prompt {
        font-size: 20px;
    }

    .tile {
        font-size: 18px;
    }

    .match-label {
        width: 100%;
    }
}
</style>
</head>

<body>

<main>

    <header>
        <div>
            <h1>结果补语 · 把字句</h1>
            <div class="subtitle">练习</div>
        </div>

        <div class="count" id="overall"></div>
    </header>

    <div class="progress">
        <div class="bar" id="bar"></div>
    </div>

    <nav class="tabs" id="tabs"></nav>

    <section class="panel">

        <div class="top">
            <span id="section"></span>
            <span id="number"></span>
        </div>

        <div id="work"></div>

        <div class="actions">
            <button id="prev">上一题</button>
            <button id="check" class="primary">检查</button>
            <button id="next">下一题</button>
            <button id="reset">重做</button>

            <span class="status" id="status"></span>
        </div>

        <div id="reference" class="reference hidden"></div>

    </section>

</main>

<script>
"use strict";

const sets = [
    {
        label: "排序",
        type: "order",
        items: [
            {
                parts: ["朋友", "把", "我的手机", "弄坏了", "。"],
                answer: "朋友把我的手机弄坏了。"
            },
            {
                parts: ["我", "终于", "把", "这些生词", "记住了", "。"],
                answer: "我终于把这些生词记住了。"
            },
            {
                parts: ["我", "把", "这篇文章", "翻译成", "俄语", "了", "。"],
                answer: "我把这篇文章翻译成俄语了。"
            },
            {
                parts: ["他", "把", "照片", "挂在", "墙上", "了", "。"],
                answer: "他把照片挂在墙上了。"
            },
            {
                parts: ["警察", "终于", "把", "小偷", "抓住了", "。"],
                answer: "警察终于把小偷抓住了。"
            },
            {
                parts: ["我", "不小心", "把", "鞋子", "弄坏了", "。"],
                answer: "我不小心把鞋子弄坏了。"
            }
        ]
    },

    {
        label: "选择",
        type: "choice",
        items: [
            {
                before: "我终于学",
                after: "了怎么系鞋带。",
                options: ["完", "会", "见", "错"],
                correct: "会"
            },
            {
                before: "老师讲的故事我没听",
                after: "。",
                options: ["见", "完", "懂", "到"],
                correct: "懂"
            },
            {
                before: "我把校长的名字记",
                after: "了。",
                options: ["错", "见", "会", "够"],
                correct: "错"
            },
            {
                before: "我终于找",
                after: "了我的鞋子。",
                options: ["完", "着", "懂", "会"],
                correct: "着"
            },
            {
                before: "我把不需要的照片删",
                after: "了。",
                options: ["懂", "掉", "见", "会"],
                correct: "掉"
            },
            {
                before: "我把蛋糕吃",
                after: "了。",
                options: ["够", "见", "懂", "错"],
                correct: "够"
            },
            {
                before: "我把窗户关",
                after: "了。",
                options: ["错", "上", "懂", "会"],
                correct: "上"
            },
            {
                before: "他终于考",
                after: "了大学。",
                options: ["见", "懂", "上", "错"],
                correct: "上"
            }
        ]
    },

    {
        label: "把字句",
        type: "transform",
        items: [
            {
                question: "朋友弄坏了我的手机。",
                answers: [
                    "朋友把我的手机弄坏了。"
                ]
            },
            {
                question: "我删掉了所有不符合要求的照片。",
                answers: [
                    "我把所有不符合要求的照片删掉了。"
                ]
            },
            {
                question: "他关上了窗户。",
                answers: [
                    "他把窗户关上了。"
                ]
            },
            {
                question: "我记错了校长的名字。",
                answers: [
                    "我把校长的名字记错了。"
                ]
            },
            {
                question: "警察抓住了小偷。",
                answers: [
                    "警察把小偷抓住了。"
                ]
            }
        ]
    },

    {
        label: "改错",
        type: "correct",
        items: [
            {
                question: "我把这篇文章翻译了成俄语。",
                answers: [
                    "我把这篇文章翻译成俄语了。"
                ]
            },
            {
                question: "我把作业做完不。",
                answers: [
                    "我没把作业做完。",
                    "我没有把作业做完。"
                ]
            },
            {
                question: "我把看见了小偷。",
                answers: [
                    "我看见了小偷。"
                ]
            },
            {
                question: "他把大学考上了一个。",
                answers: [
                    "他考上了一所大学。"
                ]
            },
            {
                question: "我把窗户关了上。",
                answers: [
                    "我把窗户关上了。"
                ]
            }
        ]
    },

    {
        label: "搭配",
        type: "match",
        items: [
            {
                verb: "听",
                pairs: [
                    ["听到声音", "到"],
                    ["理解老师说的话", "懂"],
                    ["从头到尾听故事", "完"],
                    ["听错名字", "错"]
                ]
            },
            {
                verb: "看",
                pairs: [
                    ["看到小偷", "见"],
                    ["理解文章", "懂"],
                    ["看完电影", "完"],
                    ["看错时间", "错"]
                ]
            },
            {
                verb: "做",
                pairs: [
                    ["做好准备", "好"],
                    ["做完作业", "完"],
                    ["做错一道题", "错"]
                ]
            },
            {
                verb: "记",
                pairs: [
                    ["记住生词", "住"],
                    ["记错名字", "错"]
                ]
            },
            {
                verb: "找",
                pairs: [
                    ["找到鞋子", "到"],
                    ["找着钥匙", "着"]
                ]
            }
        ]
    }
];

const STORAGE_KEY = "resultative-v2";

let tab = 0;
let index = 0;

let saved = {};

try {
    saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
} catch (error) {
    saved = {};
}

let state = {};

const $ = id => document.getElementById(id);

const key = () => `${tab}-${index}`;

const item = () => sets[tab].items[index];

function normalize(text) {
    return String(text || "")
        .replace(/[\s。！？,.，、]/g, "");
}

function store() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
    } catch (error) {
        console.warn("无法保存进度", error);
    }
}

function total() {
    const all = sets.reduce(
        (sum, section) => sum + section.items.length,
        0
    );

    const done = Object.values(saved).filter(
        value => value === true
    ).length;

    $("overall").textContent = `${done} / ${all}`;

    $("bar").style.width = `${(done / all) * 100}%`;
}

function createTile(text) {
    const button = document.createElement("button");

    button.type = "button";
    button.className = "tile";
    button.textContent = text;

    return button;
}

function shuffle(array) {
    const result = [...array];

    for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));

        [result[i], result[j]] = [result[j], result[i]];
    }

    return result;
}

function renderTabs() {
    const container = $("tabs");

    container.innerHTML = "";

    sets.forEach((section, i) => {
        const button = document.createElement("button");

        button.type = "button";

        button.className =
            "tab" + (i === tab ? " active" : "");

        button.textContent = section.label;

        button.addEventListener("click", () => {
            tab = i;
            index = 0;
            render();
        });

        container.appendChild(button);
    });
}

function renderOrder(question, container) {
    const label = document.createElement("p");

    label.className = "group";
    label.textContent = "排列词语";

    const answer = document.createElement("div");
    answer.className = "answer";

    const bank = document.createElement("div");
    bank.className = "tiles";

    container.append(label, answer, bank);

    const order = shuffle(
        question.parts.map((_, i) => i)
    );

    function draw() {
        answer.innerHTML = "";
        bank.innerHTML = "";

        state.chosen.forEach((id, position) => {
            const button = createTile(question.parts[id]);

            button.addEventListener("click", () => {
                state.chosen.splice(position, 1);
                draw();
            });

            answer.appendChild(button);
        });

        order
            .filter(id => !state.chosen.includes(id))
            .forEach(id => {
                const button = createTile(question.parts[id]);

                button.addEventListener("click", () => {
                    state.chosen.push(id);
                    draw();
                });

                bank.appendChild(button);
            });
    }

    draw();
}

function renderChoice(question, container) {
    const prompt = document.createElement("p");

    prompt.className = "prompt";
    prompt.textContent =
        question.before + " ___ " + question.after;

    const choices = document.createElement("div");
    choices.className = "choices";

    question.options.forEach(option => {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "choice";
        button.textContent = option;

        button.addEventListener("click", () => {
            state.choice = option;

            choices.querySelectorAll("button").forEach(b => {
                b.classList.toggle("active", b === button);
            });
        });

        choices.appendChild(button);
    });

    container.append(prompt, choices);
}

function renderTextInput(question, container) {
    const prompt = document.createElement("p");

    prompt.className = "prompt";
    prompt.textContent = question.question;

    const input = document.createElement("input");

    input.type = "text";
    input.className = "field";
    input.lang = "zh-CN";
    input.autocomplete = "off";
    input.placeholder = "＿＿＿＿＿＿＿＿";

    input.addEventListener("keydown", event => {
        if (event.key === "Enter" && !event.isComposing) {
            check();
        }
    });

    container.append(prompt, input);
}

function renderMatch(question, container) {
    const prompt = document.createElement("p");

    prompt.className = "prompt";
    prompt.textContent = question.verb + " ＋ ？";

    container.appendChild(prompt);

    const complements = [
        "好", "错", "见", "懂", "完",
        "到", "会", "住", "上", "够", "着"
    ];

    const correctOptions = [
        ...new Set(question.pairs.map(pair => pair[1]))
    ];

    const distractors = shuffle(
        complements.filter(
            value => !correctOptions.includes(value)
        )
    );

    const options = shuffle([
        ...correctOptions,
        ...distractors.slice(
            0,
            Math.max(0, 4 - correctOptions.length)
        )
    ]);

    question.pairs.forEach(([phrase], pairIndex) => {
        const row = document.createElement("div");

        row.className = "match-row";

        const label = document.createElement("span");

        label.className = "match-label";
        label.textContent = phrase;

        row.appendChild(label);

        options.forEach(option => {
            const button = createTile(option);

            button.classList.add("match-choice");

            button.addEventListener("click", () => {
                state.match[pairIndex] = option;

                row.querySelectorAll("button").forEach(b => {
                    b.classList.toggle(
                        "selected",
                        b === button
                    );
                });
            });

            row.appendChild(button);
        });

        container.appendChild(row);
    });
}

function render() {
    state = {
        chosen: [],
        choice: null,
        match: {},
        checked: false
    };

    const section = sets[tab];
    const question = item();

    renderTabs();

    $("section").textContent = section.label;

    $("number").textContent =
        `${index + 1} / ${section.items.length}`;

    $("status").textContent = "";
    $("status").className = "status";

    $("reference").classList.add("hidden");
    $("reference").textContent = "";

    $("check").disabled = false;

    const container = $("work");

    container.innerHTML = "";

    switch (section.type) {
        case "order":
            renderOrder(question, container);
            break;

        case "choice":
            renderChoice(question, container);
            break;

        case "transform":
        case "correct":
            renderTextInput(question, container);
            break;

        case "match":
            renderMatch(question, container);
            break;
    }

    $("prev").disabled = index === 0;

    $("next").disabled =
        index === section.items.length - 1;

    total();
}

function check() {
    const section = sets[tab];
    const question = item();

    let correct = false;
    let solution = "";

    switch (section.type) {
        case "order": {
            const response = state.chosen
                .map(i => question.parts[i])
                .join("");

            correct =
                state.chosen.length === question.parts.length &&
                normalize(response) === normalize(question.answer);

            solution = question.answer;

            break;
        }

        case "choice": {
            correct = state.choice === question.correct;

            solution =
                question.before +
                question.correct +
                question.after;

            break;
        }

        case "transform":
        case "correct": {
            const input = $("work").querySelector("input");

            const response = input.value;

            correct = question.answers.some(
                answer =>
                    normalize(answer) === normalize(response)
            );

            solution = question.answers[0];

            break;
        }

        case "match": {
            correct = question.pairs.every(
                ([, expected], i) =>
                    state.match[i] === expected
            );

            solution = question.pairs
                .map(([phrase, complement]) =>
                    `${phrase} → ${complement}`
                )
                .join("　·　");

            break;
        }
    }

    $("status").textContent = correct ? "✓" : "✕";

    $("status").className =
        "status " + (correct ? "good" : "bad");

    $("reference").textContent = solution;

    $("reference").classList.remove("hidden");

    saved[key()] = correct;

    store();
    total();

    state.checked = true;
}

$("check").addEventListener("click", check);

$("prev").addEventListener("click", () => {
    if (index > 0) {
        index--;
        render();
    }
});

$("next").addEventListener("click", () => {
    if (index < sets[tab].items.length - 1) {
        index++;
        render();
    }
});

$("reset").addEventListener("click", () => {
    render();
});

render();
</script>

</body>
</html>
